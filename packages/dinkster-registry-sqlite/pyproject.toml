[project]
name = "dinkster-registry-sqlite"
version = "0.0.1"
description = "Dinkster registry service: durable storage and operations over the pure registry model"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "dinkster-api @ git+https://github.com/Kosinkadink/Dinkster.git@4258cb557cb684f8723c4dc0cf022b4a65e48baa#subdirectory=packages/dinkster-api",
    "dinkster-assets @ git+https://github.com/Kosinkadink/Dinkster.git@4258cb557cb684f8723c4dc0cf022b4a65e48baa#subdirectory=packages/dinkster-assets",
    "dinkster-caches @ git+https://github.com/Kosinkadink/Dinkster.git@4258cb557cb684f8723c4dc0cf022b4a65e48baa#subdirectory=packages/dinkster-caches",
    "dinkster-inference @ git+https://github.com/Kosinkadink/Dinkster.git@4258cb557cb684f8723c4dc0cf022b4a65e48baa#subdirectory=packages/dinkster-inference",
    "dinkster-memory @ git+https://github.com/Kosinkadink/Dinkster.git@4258cb557cb684f8723c4dc0cf022b4a65e48baa#subdirectory=packages/dinkster-memory",
    "dinkster-protocol @ git+https://github.com/Kosinkadink/Dinkster.git@4258cb557cb684f8723c4dc0cf022b4a65e48baa#subdirectory=packages/dinkster-protocol",
    "dinkster-registry @ git+https://github.com/Kosinkadink/Dinkster.git@4258cb557cb684f8723c4dc0cf022b4a65e48baa#subdirectory=packages/dinkster-registry",
    "dinkster-schema @ git+https://github.com/Kosinkadink/Dinkster.git@4258cb557cb684f8723c4dc0cf022b4a65e48baa#subdirectory=packages/dinkster-schema",
    "dinkster-values @ git+https://github.com/Kosinkadink/Dinkster.git@4258cb557cb684f8723c4dc0cf022b4a65e48baa#subdirectory=packages/dinkster-values",
    "dinkster-workers @ git+https://github.com/Kosinkadink/Dinkster.git@4258cb557cb684f8723c4dc0cf022b4a65e48baa#subdirectory=packages/dinkster-workers",
]

[project.scripts]
dinkster-registry-sqlite = "dinkster_registry_sqlite.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_registry_sqlite"]

[tool.hatch.metadata]
allow-direct-references = true
