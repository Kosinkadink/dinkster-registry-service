name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ${{ fromJSON(vars.CI_RUNNERS).linux }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200
        with:
          version: 0.5.1
      - name: Validate Fly service configuration
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl config validate --config fly.toml
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false
          python-version: "3.12"
      - name: Sync public Dinkster dependency without credentials
        run: env -u GH_TOKEN -u GITHUB_TOKEN uv sync --frozen
      - name: Verify no global Git URL rewrites
        run: |
          test -z "$(git config --global --get-regexp '^url\.' || true)"
          echo "global_url_rewrites=none"
      - run: uv lock --check
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: bash scripts/with-test-postgres.sh uv run pytest -q
      - run: uv build

  conformance:
    runs-on: ${{ fromJSON(vars.CI_RUNNERS).linux }}
    timeout-minutes: 10
    env:
      DINKSTER_OBJECT_STORE_ROOT: .data/conformance-objects
      DINKSTER_CURSOR_SECRET: conformance-cursor-secret-at-least-32-bytes
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false
          python-version: "3.12"
      - name: Sync public Dinkster dependency without credentials
        run: env -u GH_TOKEN -u GITHUB_TOKEN uv sync --frozen
      - name: Verify no global Git URL rewrites
        run: |
          test -z "$(git config --global --get-regexp '^url\.' || true)"
          echo "global_url_rewrites=none"
      - name: Run HTTP conformance suite
        run: |
          bash scripts/with-test-postgres.sh bash -e <<'SH'
          http_port=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')
          export DINKSTER_PUBLIC_BASE_URL="http://127.0.0.1:$http_port"
          uv run alembic upgrade head
          uv run dinkster-registry seed
          .venv/bin/dinkster-registry serve --host 127.0.0.1 --port "$http_port" &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null; wait "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            kill -0 "$server_pid"
            if curl --fail --silent "$DINKSTER_PUBLIC_BASE_URL/v1/health" >/dev/null; then
              break
            fi
            sleep 1
          done
          kill -0 "$server_pid"
          uv run python conformance/run.py "$DINKSTER_PUBLIC_BASE_URL"
          SH
      - name: Run SQLite HTTP conformance suite
        env:
          DINKSTER_DATABASE_URL: sqlite:///.data/conformance.db
          DINKSTER_OBJECT_STORE_ROOT: .data/sqlite-conformance-objects
        run: |
          http_port=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')
          export DINKSTER_PUBLIC_BASE_URL="http://127.0.0.1:$http_port"
          rm -f .data/conformance.db
          uv run dinkster-registry seed
          .venv/bin/dinkster-registry serve --host 127.0.0.1 --port "$http_port" &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null; wait "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            kill -0 "$server_pid"
            if curl --fail --silent "$DINKSTER_PUBLIC_BASE_URL/v1/health" >/dev/null; then
              break
            fi
            sleep 1
          done
          kill -0 "$server_pid"
          uv run python conformance/run.py "$DINKSTER_PUBLIC_BASE_URL"

  container:
    runs-on: ${{ fromJSON(vars.CI_RUNNERS).linux }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build container
        run: DOCKER_BUILDKIT=1 docker build --network host --tag dinkster-registry:test .
      - name: Inspect container contents
        run: |
          set -o pipefail
          # Docker inspect reports different size units across image stores.
          compressed_image_bytes=$(docker image save dinkster-registry:test | gzip -c | wc -c)
          echo "compressed_image_bytes=$compressed_image_bytes"
          test "$compressed_image_bytes" -le 200000000
          container_id=$(docker create --network none dinkster-registry:test)
          archive=$(mktemp)
          trap 'docker rm "$container_id" >/dev/null; rm -f "$archive"' EXIT
          docker export --output "$archive" "$container_id"
          paths=$(tar -tf "$archive")
          if printf '%s\n' "$paths" | grep -E '(^|/)\.cache/uv(/|$)|(^|/)\.git(/|$)'; then
            echo "forbidden cache or Git content found" >&2
            exit 1
          fi
          if printf '%s\n' "$paths" | grep -E 'site-packages/(dinkster_schema|dinkster_values)/(.*/)?(tests?|goldens?)(/|$)'; then
            echo "Dinkster test or golden content found" >&2
            exit 1
          fi
          echo "forbidden_paths=none"
      - name: Run command help smoke test
        run: docker run --rm --network none dinkster-registry:test dinkster-registry --help
      - name: Run isolated executable probe
        run: docker run --rm --network none --privileged dinkster-registry:test python scripts/check-isolated-probe.py
      - name: Run container conformance suite
        run: |
          bash scripts/with-test-postgres.sh bash -e <<'SH'
          http_port=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')
          export DINKSTER_PUBLIC_BASE_URL="http://127.0.0.1:$http_port"
          name="registry-conformance-$(python3 -c 'import uuid; print(uuid.uuid4().hex)')"
          trap 'docker rm --force "$name" >/dev/null' EXIT
          docker run --detach --privileged --name "$name" \
            --network host \
            --env DINKSTER_DATABASE_URL \
            --env DINKSTER_PUBLIC_BASE_URL \
            --env HTTP_HOST="$(python3 -c 'import tomllib; print(tomllib.load(open("fly.toml", "rb"))["env"]["HTTP_HOST"])')" \
            --env HTTP_PORT="$http_port" \
            --env DINKSTER_CURSOR_SECRET=container-conformance-secret-at-least-32-bytes \
            dinkster-registry:test \
            bash -ec 'alembic upgrade head; dinkster-registry seed; exec bash scripts/start-service.sh'
          for attempt in $(seq 1 30); do
            test "$(docker inspect --format '{{.State.Running}}' "$name")" = true
            if docker exec "$name" python -c 'import os, urllib.request; urllib.request.urlopen(os.environ["DINKSTER_PUBLIC_BASE_URL"] + "/v1/health", timeout=2)'; then
              break
            fi
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Running}}' "$name")" = true
          docker exec "$name" python conformance/run.py "$DINKSTER_PUBLIC_BASE_URL"
          SH
      - name: Admit every published official pack and verify release-lock digests
        run: |
          bash scripts/with-test-postgres.sh bash -e <<'SH'
          docker run --rm --privileged --network host \
            --env DINKSTER_DATABASE_URL \
            dinkster-registry:test \
            bash -ec 'alembic upgrade head; python scripts/check-release-packs.py /tmp/official-packs --download-only; python scripts/check-release-packs.py /tmp/official-packs'
          SH

  deploy:
    needs: [checks, conformance, container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.FLY_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
