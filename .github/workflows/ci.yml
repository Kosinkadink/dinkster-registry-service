name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ${{ fromJSON(vars.CI_RUNNERS).linux }}
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:${{ job.services.postgres.ports[5432] }}/dinkster_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dinkster_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dinkster_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Sync private Dinkster dependency
        env:
          DINKSTER_REPO_TOKEN: ${{ secrets.DINKSTER_REPO_TOKEN }}
        run: |
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="url.https://x-access-token:${DINKSTER_REPO_TOKEN}@github.com/.insteadOf" \
          GIT_CONFIG_VALUE_0="https://github.com/" \
          env -u GITHUB_TOKEN uv sync --frozen
      - name: Verify no global Git URL rewrites
        run: |
          test -z "$(git config --global --get-regexp '^url\.' || true)"
          echo "global_url_rewrites=none"
      - run: uv lock --check
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run pytest -q
      - run: uv build

  conformance:
    runs-on: ${{ fromJSON(vars.CI_RUNNERS).linux }}
    env:
      DINKSTER_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:${{ job.services.postgres.ports[5432] }}/dinkster_conformance
      DINKSTER_OBJECT_STORE_ROOT: .data/conformance-objects
      DINKSTER_PUBLIC_BASE_URL: http://127.0.0.1:8000
      DINKSTER_CURSOR_SECRET: conformance-cursor-secret-at-least-32-bytes
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dinkster_conformance
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dinkster_conformance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"
          save-cache: false
      - name: Sync private Dinkster dependency
        env:
          DINKSTER_REPO_TOKEN: ${{ secrets.DINKSTER_REPO_TOKEN }}
        run: |
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="url.https://x-access-token:${DINKSTER_REPO_TOKEN}@github.com/.insteadOf" \
          GIT_CONFIG_VALUE_0="https://github.com/" \
          env -u GITHUB_TOKEN uv sync --frozen
      - name: Verify no global Git URL rewrites
        run: |
          test -z "$(git config --global --get-regexp '^url\.' || true)"
          echo "global_url_rewrites=none"
      - name: Run HTTP conformance suite
        run: |
          uv run alembic upgrade head
          uv run dinkster-registry seed
          uv run dinkster-registry serve --host 127.0.0.1 --port 8000 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/v1/health >/dev/null; then
              break
            fi
            sleep 1
          done
          uv run python conformance/run.py http://127.0.0.1:8000
      - name: Run SQLite HTTP conformance suite
        env:
          DINKSTER_DATABASE_URL: sqlite:///.data/conformance.db
          DINKSTER_OBJECT_STORE_ROOT: .data/sqlite-conformance-objects
        run: |
          rm -f .data/conformance.db
          uv run dinkster-registry seed
          uv run dinkster-registry serve --host 127.0.0.1 --port 8000 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/v1/health >/dev/null; then
              break
            fi
            sleep 1
          done
          uv run python conformance/run.py http://127.0.0.1:8000

  container:
    runs-on: ${{ fromJSON(vars.CI_RUNNERS).linux }}
    steps:
      - uses: actions/checkout@v7
      - name: Build container
        env:
          DINKSTER_REPO_TOKEN: ${{ secrets.DINKSTER_REPO_TOKEN }}
        run: DOCKER_BUILDKIT=1 docker build --secret id=dinkster_repo_token,env=DINKSTER_REPO_TOKEN --tag dinkster-registry:test .
      - name: Inspect container contents
        run: |
          image_size_bytes=$(docker image inspect --format '{{.Size}}' dinkster-registry:test)
          test "$image_size_bytes" -le 200000000
          container_id=$(docker create dinkster-registry:test)
          archive=$(mktemp)
          trap 'docker rm "$container_id" >/dev/null; rm -f "$archive"' EXIT
          docker export --output "$archive" "$container_id"
          paths=$(tar -tf "$archive")
          if printf '%s\n' "$paths" | grep -E '(^|/)\.cache/uv(/|$)|(^|/)\.git(/|$)'; then
            echo "forbidden cache or Git content found" >&2
            exit 1
          fi
          if printf '%s\n' "$paths" | grep -E 'site-packages/(dinkster_schema|dinkster_values)/(.*/)?(tests?|goldens?)(/|$)'; then
            echo "Dinkster test or golden content found" >&2
            exit 1
          fi
          echo "image_size_bytes=$image_size_bytes"
          echo "forbidden_paths=none"
      - name: Run command help smoke test
        run: docker run --rm dinkster-registry:test dinkster-registry --help
      - name: Run isolated executable probe
        run: docker run --rm --privileged --user root dinkster-registry:test python scripts/check-isolated-probe.py
      - name: Run container conformance suite
        run: |
          docker network create dinkster-registry-test
          docker run --detach --name dinkster-registry-postgres \
            --network dinkster-registry-test \
            --env POSTGRES_DB=dinkster_registry \
            --env POSTGRES_PASSWORD=postgres \
            postgres:16-alpine
          trap 'docker rm --force dinkster-registry-test dinkster-registry-postgres >/dev/null 2>&1 || true; docker network rm dinkster-registry-test >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if docker exec dinkster-registry-postgres pg_isready -U postgres -d dinkster_registry; then
              break
            fi
            sleep 1
          done
          docker run --detach --name dinkster-registry-test \
            --network dinkster-registry-test \
            --env DINKSTER_DATABASE_URL=postgresql+psycopg://postgres:postgres@dinkster-registry-postgres:5432/dinkster_registry \
            --env DINKSTER_PUBLIC_BASE_URL=http://127.0.0.1:8000 \
            --env DINKSTER_CURSOR_SECRET=container-conformance-secret-at-least-32-bytes \
            dinkster-registry:test \
            /app/scripts/start-dev.sh
          for attempt in $(seq 1 30); do
            if docker exec dinkster-registry-test python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=2)"; then
              break
            fi
            sleep 1
          done
          docker exec dinkster-registry-test python conformance/run.py http://127.0.0.1:8000
