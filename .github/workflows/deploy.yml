name: Deploy immutable image

on:
  workflow_call:
    secrets:
      FLY_API_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: fly-production-dinkster-registry
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.FLY_DEPLOY_ENABLED == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNERS).linux }}
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate production prerequisites
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          test "$(hostname | tr '[:upper:]' '[:lower:]')" = kosin-x570-aorus-ultra
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$FLY_API_TOKEN"
          docker_config="$RUNNER_TEMP/fly-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 "$docker_config"
          printf 'DOCKER_CONFIG=%s\n' "$docker_config" >> "$GITHUB_ENV"
      - uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200
        with:
          version: 0.5.1
      - name: Build the exact pushed commit and push its image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl auth docker
          image="registry.fly.io/dinkster-registry:${GITHUB_SHA}"
          DOCKER_BUILDKIT=1 docker build --network host \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image" .
          docker push "$image"
          digest=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
          printf 'FLY_IMAGE=%s\n' "$digest" >> "$GITHUB_ENV"
      - name: Migrate with short-lived administrator credentials
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: python3 scripts/migrate_image.py --image "$FLY_IMAGE"
      - name: Deploy both replicas with health checks and rollback
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: >-
          python3 scripts/deploy_image.py --app dinkster-registry --region sjc
          --image "$FLY_IMAGE"
      - name: Record deployment evidence
        if: always()
        run: |
          printf 'Commit: %s\nImage: %s\nRun: %s/%s/actions/runs/%s\n' \
            "$GITHUB_SHA" "${FLY_IMAGE:-not-built}" "$GITHUB_SERVER_URL" \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove registry credentials
        if: always()
        run: |
          if test -n "${DOCKER_CONFIG:-}"; then
            rm -rf -- "$DOCKER_CONFIG"
          fi
