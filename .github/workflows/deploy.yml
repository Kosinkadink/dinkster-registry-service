name: Deploy immutable image

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
    secrets:
      FLY_API_TOKEN:
        required: true
      DINKSTER_REPO_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: fly-production-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.FLY_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ${{ inputs.app }}
      FLY_REGION: ${{ vars.FLY_REGION }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate production prerequisites
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$FLY_API_TOKEN"
          case "$FLY_REGION" in iad|sjc) ;; *) exit 1 ;; esac
          test -f Dockerfile
          test -f fly.toml
          docker_config="$RUNNER_TEMP/fly-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 "$docker_config"
          printf 'DOCKER_CONFIG=%s\n' "$docker_config" >> "$GITHUB_ENV"
      - uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200
        with:
          version: 0.3.234
      - name: Build the pushed commit and push its image
        env:
          DINKSTER_REPO_TOKEN: ${{ secrets.DINKSTER_REPO_TOKEN }}
        run: |
          flyctl auth docker
          image="registry.fly.io/${FLY_APP}:${GITHUB_SHA}"
          DOCKER_BUILDKIT=1 docker build \
            --secret id=dinkster_repo_token,env=DINKSTER_REPO_TOKEN \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image" .
          docker push "$image"
          digest=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
          printf 'FLY_IMAGE=%s\n' "$digest" >> "$GITHUB_ENV"
      - name: Deploy with health checks and automatic rollback
        run: >-
          python3 scripts/deploy_image.py --app "$FLY_APP" --region "$FLY_REGION"
          --image "$FLY_IMAGE"
      - name: Record deployment evidence
        if: always()
        run: |
          printf 'Commit: %s\nImage: %s\nRun: %s/%s/actions/runs/%s\n' \
            "$GITHUB_SHA" "${FLY_IMAGE:-not-built}" "$GITHUB_SERVER_URL" \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove registry credentials
        if: always()
        run: |
          if test -n "${DOCKER_CONFIG:-}"; then
            rm -rf -- "$DOCKER_CONFIG"
          fi
