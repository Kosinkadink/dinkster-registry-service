[pack]
name = "color-tools"
namespaces = ["color"]
platforms = ["darwin", "linux", "win32"]

[pack.entry]
nodes = "nodes:PACK_NODES"

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.sandbox]
gpu = false
network = false
writable-mounts = false

[pack.release]
version = "0.4.0"
dinkster = ">=0.9,<1"
license = "Apache-2.0"
repository = "https://github.com/example-author/dinkster-color-tools"
