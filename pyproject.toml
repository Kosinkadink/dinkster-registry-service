[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dinkster-registry-service"
version = "0.1.0"
description = "Hosted catalog service for Dinkster node packs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "blake3>=1.0,<2",
  "boto3>=1.40,<2",
  "dinkster-api @ git+https://github.com/Kosinkadink/Dinkster.git@c39cb0c205d53a4251e90547936484071fe1e95c#subdirectory=packages/dinkster-api",
  "fastapi>=0.116,<1",
  "packaging>=25,<26",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.22,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.35,<1",
]

[project.scripts]
dinkster-registry = "dinkster_registry_service.cli:main"

[dependency-groups]
dev = [
  "httpx2>=2.12,<3",
  "moto[s3,server]>=5,<6",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_registry_service"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = ".core-validation"
venv = ".venv"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
