app = "dinkster-registry"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[processes]
  app = "bash scripts/start-service.sh"

[env]
  DINKSTER_ENV = "production"
  DINKSTER_PUBLIC_BASE_URL = "https://registry.dinkster.org"

[deploy]
  strategy = "rolling"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 2

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
